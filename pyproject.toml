[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "volatrade"
version = "1.0.0"
description = "Selection d'actions tres volatiles, mesure du risque et plans d'achat/vente chiffres"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
volatrade = "volatrade.cli:main"

[tool.setuptools.packages.find]
include = ["volatrade*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
