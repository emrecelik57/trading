[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantfolio"
version = "0.1.0"
description = "Modele de scoring cross-sectionnel et gestion de portefeuille actions (signaux d'achat/vente quotidiens)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
quantfolio = "quantfolio.cli:main"

[tool.setuptools.packages.find]
include = ["quantfolio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests d'apprentissage du modele (quelques dizaines de secondes)",
]
